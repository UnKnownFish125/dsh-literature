<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱 · 岛群预览</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--surface-2:#edf1f7;--ink:#182230;--muted:#66758a;--line:#cbd5e1;--grid:#dfe6ef;--accent:#2267d8;--shadow:0 14px 35px rgba(34,51,76,.12);--core:#3278e8;--runtime:#729b8b;--project:#e39a4a;--bias:#dc6572;--eco:#8d72c9}
[data-theme="dark"]{--bg:#111822;--surface:#182230;--surface-2:#202d3d;--ink:#e7edf6;--muted:#97a8bd;--line:#354457;--grid:#273546;--accent:#72a5ff;--shadow:0 18px 42px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{height:68px;display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}.brand{display:flex;align-items:center;gap:12px;min-width:220px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f78e5,#735fc0);position:relative;box-shadow:0 6px 14px rgba(47,120,229,.25)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:#fff;border-radius:50%}.brand-mark:before{width:9px;height:9px;left:8px;top:8px;box-shadow:12px 8px 0 #fff,3px 17px 0 #fff}.brand-mark:after{width:20px;height:2px;left:10px;top:15px;transform:rotate(32deg);box-shadow:-1px 7px 0 rgba(255,255,255,.8)}h1{font-size:16px;line-height:1.2;margin:0;font-weight:720;letter-spacing:.2px}.subtitle{font-size:11px;color:var(--muted);margin-top:3px}.metrics{display:flex;gap:10px;flex:1}.metric{padding:7px 12px;border-left:1px solid var(--line);font-size:12px;color:var(--muted)}.metric b{font-size:16px;color:var(--ink);margin-right:4px}.tools{display:flex;gap:8px}.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);height:34px;padding:0 11px;border-radius:7px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{position:relative;min-height:0}.canvas-wrap{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(89,132,194,.07),transparent 55%),var(--bg)}.canvas-wrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px;opacity:.34;mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent)}svg{width:100%;height:100%;display:block;touch-action:none}.world{transform-origin:0 0}.edge{stroke:var(--line);stroke-width:1.2;opacity:.42;vector-effect:non-scaling-stroke}.edge.cross{stroke-dasharray:4 5;opacity:.25}.edge.active{stroke:var(--accent);stroke-width:2;opacity:.9}.island{stroke-width:1;fill-opacity:.1;stroke-opacity:.35}.island-label{font-size:12px;font-weight:650;fill:var(--muted);letter-spacing:.4px;pointer-events:none}.node{cursor:grab;stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}.node:active{cursor:grabbing}.node.dim{opacity:.18}.node.active{stroke:var(--accent);stroke-width:3}.node-label{font-size:10px;fill:var(--ink);pointer-events:none;opacity:0;transition:opacity .15s}.node:hover+.node-label,.node.active+.node-label{opacity:1}.tooltip{position:fixed;z-index:8;pointer-events:none;display:none;max-width:280px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;line-height:1.45}.tooltip strong{display:block;font-size:12px;margin-bottom:3px}.tooltip span{color:var(--muted)}.legend{position:absolute;left:18px;bottom:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--shadow);display:flex;gap:13px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.status{position:absolute;right:18px;bottom:18px;font-size:11px;color:var(--muted);padding:7px 10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:6px}.panel{position:absolute;right:18px;top:18px;width:258px;padding:16px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);transform:translateX(0);transition:transform .2s;z-index:3}.panel.empty{transform:translateX(calc(100% + 20px))}.panel h2{font-size:14px;line-height:1.4;margin:0 0 10px}.panel .tag{display:inline-flex;padding:3px 7px;border-radius:99px;font-size:10px;background:var(--surface-2);color:var(--muted);margin-bottom:14px}.detail-grid{display:grid;grid-template-columns:70px 1fr;gap:8px;font-size:12px;border-top:1px solid var(--line);padding-top:12px}.detail-grid dt{color:var(--muted)}.detail-grid dd{margin:0}.close{float:right;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}.hint{position:absolute;top:18px;left:18px;color:var(--muted);font-size:11px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--surface) 85%,transparent)}
@media(max-width:700px){.topbar{height:60px;padding:0 13px;gap:10px}.brand{min-width:0}.brand-mark{width:30px;height:30px}.metrics{display:none}.subtitle{display:none}.tools{margin-left:auto}.btn span{display:none}.panel{right:10px;top:10px;width:min(258px,calc(100% - 20px))}.legend{left:10px;bottom:10px;gap:8px}.status{right:10px;bottom:10px}.hint{display:none}}
</style>
</head>
<body>
<div class="app" id="app" data-theme="light">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><h1>知识图谱 · 岛群</h1><div class="subtitle">community topology preview</div></div></div>
    <div class="metrics"><div class="metric"><b id="nodeCount">--</b>节点</div><div class="metric"><b id="edgeCount">--</b>关系</div><div class="metric"><b id="islandCount">--</b>岛屿</div></div>
    <div class="tools"><button class="btn" id="reset" title="重置视图"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>重置</span></button><button class="btn" id="theme" title="切换主题"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg><span>主题</span></button>
    </div>
  </header>
  <main class="main"><div class="canvas-wrap" id="canvasWrap"><svg id="graph" role="img" aria-label="岛群状知识图谱"><g id="world"><g id="islands"></g><g id="edges"></g><g id="nodes"></g></g></svg></div><div class="hint">拖拽画布平移 · 滚轮缩放 · 点击节点查看详情</div><div class="legend"><span><i style="background:var(--core)"></i>core</span><span><i style="background:var(--runtime)"></i>runtime</span><span><i style="background:var(--project)"></i>project</span><span><i style="background:var(--bias)"></i>bias</span><span><i style="background:var(--eco)"></i>eco</span></div><div class="status" id="status">正在载入图谱…</div><aside class="panel empty" id="panel"><button class="close" id="close" aria-label="关闭">×</button><h2 id="detailTitle"></h2><div class="tag" id="detailLib"></div><dl class="detail-grid"><dt>节点 ID</dt><dd id="detailId"></dd><dt>连接数</dt><dd id="detailDegree"></dd><dt>关系</dt><dd id="detailRelations"></dd></dl></aside></main>
</div><div class="tooltip" id="tooltip"><strong></strong><span></span></div>
<script>
(() => {
  const NS='http://www.w3.org/2000/svg', colors={core:'#3278e8',runtime:'#729b8b',project:'#e39a4a',bias:'#dc6572',eco:'#8d72c9'};
  const app=document.getElementById('app'), svg=document.getElementById('graph'), world=document.getElementById('world'), islands=document.getElementById('islands'), edgesG=document.getElementById('edges'), nodesG=document.getElementById('nodes'), tip=document.getElementById('tooltip');
  let data, positions=new Map(), nodeMap=new Map(), adjacency=new Map(), selected=null, scale=1, pan={x:0,y:0}, drag=null, viewW=1200, viewH=800;
  const el=(tag,attrs={})=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n};
  function cluster(nodes, edges){
    const labels=new Map(nodes.map(n=>[n.id,n.id])); const adj=new Map(nodes.map(n=>[n.id,[]])); edges.forEach(e=>{adj.get(e.source)?.push(e.target);adj.get(e.target)?.push(e.source)});
    for(let pass=0;pass<8;pass++){for(const n of nodes){const count={};for(const q of adj.get(n.id)||[]){const l=labels.get(q);count[l]=(count[l]||0)+1}let best=labels.get(n.id),score=0;for(const [l,s] of Object.entries(count))if(s>score){best=+l;score=s}labels.set(n.id,best)}}
    const groups=new Map();nodes.forEach(n=>{const k=labels.get(n.id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)});
    let arr=[...groups.values()].sort((a,b)=>b.length-a.length), out=[];arr.forEach(g=>{while(g.length>25)out.push(g.splice(0,25));if(g.length)out.push(g)});return out;
  }
  function layout(){
    const groups=cluster(data.nodes,data.edges), cx=viewW/2, cy=viewH/2, ring=Math.min(viewW,viewH)*.29;
    groups.forEach((group,gi)=>{const a=gi/groups.length*Math.PI*2-Math.PI/2, gx=cx+Math.cos(a)*ring, gy=cy+Math.sin(a)*ring; const r=Math.max(72,Math.sqrt(group.length)*22); group.forEach((n,i)=>{const t=i/group.length*Math.PI*2;positions.set(n.id,{x:gx+Math.cos(t)*r,y:gy+Math.sin(t)*r*.72})}); group._meta={x:gx,y:gy,r:r+42,label:labelFor(group,gi)} }); return groups;
  }
  function labelFor(g,i){const libs={};g.forEach(n=>libs[n.library]=(libs[n.library]||0)+1);const lib=Object.entries(libs).sort((a,b)=>b[1]-a[1])[0][0];const names={runtime:'运行时与工程',core:'认知核心',bias:'行为偏置',project:'项目实践',eco:'生态连接'};return names[lib]||('知识岛 '+(i+1));}
  function render(){const groups=layout(); islands.replaceChildren();edgesG.replaceChildren();nodesG.replaceChildren();
    groups.forEach(g=>{const m=g._meta; islands.append(el('circle',{cx:m.x,cy:m.y,r:m.r,fill:colors[g[0].library]||'#8aa',stroke:colors[g[0].library]||'#8aa',class:'island'}));const t=el('text',{x:m.x,y:m.y-m.r+18,'text-anchor':'middle',class:'island-label'});t.textContent=m.label;islands.append(t)});
    data.edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)return;const line=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'});line.dataset.source=e.source;line.dataset.target=e.target;edgesG.append(line)});
    data.nodes.forEach(n=>{const p=positions.get(n.id), c=colors[n.library]||'#889';const g=el('g',{transform:`translate(${p.x} ${p.y})`});const circle=el('circle',{r:Math.max(5,Math.min(10,5+degree(n.id)*.35)),fill:c,class:'node'});circle.dataset.id=n.id;const label=el('text',{x:11,y:3,class:'node-label'});label.textContent=n.concept.length>18?n.concept.slice(0,18)+'…':n.concept;g.append(circle,label);nodesG.append(g);bindNode(circle,n)});applyTransform();document.getElementById('islandCount').textContent=groups.length;document.getElementById('status').textContent='图谱已载入 · 拖拽节点可调整位置';}
  function degree(id){return adjacency.get(id)?.length||0}
  function bindNode(circle,n){circle.addEventListener('pointerenter',e=>{tip.style.display='block';tip.querySelector('strong').textContent=n.concept;tip.querySelector('span').textContent=`${n.library} · ${degree(n.id)} 个连接`;moveTip(e)});circle.addEventListener('pointermove',moveTip);circle.addEventListener('pointerleave',()=>{tip.style.display='none'});circle.addEventListener('pointerdown',e=>{e.stopPropagation();circle.setPointerCapture(e.pointerId);drag={id:n.id,circle,start:true};select(n)});circle.addEventListener('pointermove',e=>{if(!drag||drag.id!==n.id)return;const q=toWorld(e);positions.set(n.id,q);circle.parentElement.setAttribute('transform',`translate(${q.x} ${q.y})`);updateEdges(n.id)});circle.addEventListener('pointerup',()=>{if(drag?.id===n.id)drag=null});circle.addEventListener('click',()=>select(n))}
  function moveTip(e){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-100)+'px'}
  function toWorld(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-pan.x)/scale,y:(e.clientY-r.top-pan.y)/scale}}
  function updateEdges(id){edgesG.querySelectorAll(`[data-source="${id}"],[data-target="${id}"]`).forEach(l=>{const a=positions.get(+l.dataset.source),b=positions.get(+l.dataset.target);l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y)})}
  function select(n){selected=n.id;document.querySelectorAll('.node').forEach(x=>x.classList.toggle('active',+x.dataset.id===n.id));const near=new Set([n.id,...(adjacency.get(n.id)||[])]);document.querySelectorAll('.node').forEach(x=>x.classList.toggle('dim',!near.has(+x.dataset.id)));edgesG.querySelectorAll('.edge').forEach(x=>x.classList.toggle('active',+x.dataset.source===n.id||+x.dataset.target===n.id));document.getElementById('detailTitle').textContent=n.concept;document.getElementById('detailLib').textContent=n.library;document.getElementById('detailId').textContent=n.id;document.getElementById('detailDegree').textContent=degree(n.id);document.getElementById('detailRelations').textContent=[...new Set(data.edges.filter(e=>e.source===n.id||e.target===n.id).map(e=>e.relation))].join('、')||'—';document.getElementById('panel').classList.remove('empty')}
  function applyTransform(){world.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`)}
  svg.addEventListener('pointerdown',e=>{if(e.target!==svg)return;drag={panStart:{x:e.clientX-pan.x,y:e.clientY-pan.y}};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag?.panStart)return;pan.x=e.clientX-drag.panStart.x;pan.y=e.clientY-drag.panStart.y;applyTransform()});svg.addEventListener('pointerup',()=>{if(drag?.panStart)drag=null});svg.addEventListener('wheel',e=>{e.preventDefault();const before=toWorld(e), factor=e.deltaY<0?1.12:.89;scale=Math.max(.35,Math.min(3.5,scale*factor));const r=svg.getBoundingClientRect();pan.x=e.clientX-r.left-before.x*scale;pan.y=e.clientY-r.top-before.y*scale;applyTransform()},{passive:false});
  document.getElementById('reset').onclick=()=>{scale=1;pan={x:0,y:0};render()};document.getElementById('close').onclick=()=>{document.getElementById('panel').classList.add('empty');selected=null;document.querySelectorAll('.node,.edge').forEach(x=>x.classList.remove('active','dim'))};document.getElementById('theme').onclick=()=>{app.dataset.theme=app.dataset.theme==='dark'?'light':'dark'};
  function resize(){const r=document.getElementById('canvasWrap').getBoundingClientRect();viewW=r.width;viewH=r.height;if(data)render()};addEventListener('resize',resize);
  fetch('../graph-data.json').then(r=>r.json()).then(d=>{data=d;nodeMap=new Map(d.nodes.map(n=>[n.id,n]));adjacency=new Map(d.nodes.map(n=>[n.id,[]]));d.edges.forEach(e=>{adjacency.get(e.source)?.push(e.target);adjacency.get(e.target)?.push(e.source)});document.getElementById('nodeCount').textContent=d.nodes.length;document.getElementById('edgeCount').textContent=d.edges.length;resize()}).catch(err=>{document.getElementById('status').textContent='无法读取 graph-data.json';console.error(err)});
})();
</script>
</body></html>
